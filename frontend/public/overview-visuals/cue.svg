<rect x="85" y="95" width="400" height="250" rx="23" fill="url(#glass)" fill-opacity=".82" stroke="#c4d8ff" stroke-opacity=".34" filter="url(#lift)"/><rect x="1020" y="128" width="95" height="190" rx="23" fill="url(#glass)" fill-opacity=".82" stroke="#c4d8ff" stroke-opacity=".34" filter="url(#lift)"/><rect x="121" y="139" width="215" height="18" rx="9" fill="#a3b9e3" fill-opacity=".28"/><rect x="121" y="178" width="278" height="18" rx="9" fill="#a3b9e3" fill-opacity=".19"/><rect x="121" y="217" width="148" height="48" rx="15" fill="#7be0fa" fill-opacity=".78" stroke="white" stroke-opacity=".55"/><rect x="281" y="217" width="118" height="48" rx="15" fill="#cfadff" fill-opacity=".3" stroke="#b9adff"/><path d="M273 241 H298" stroke="white" stroke-width="4" stroke-linecap="round"/><path d="M405 241 C471 240 468 310 527 303 C569 299 552 211 580 210 C620 208 631 175 665 175 S720 209 750 209 S803 170 835 170 S886 209 920 209 H1002" fill="none" stroke="url(#beam)" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M535 302 C590 334 659 325 717 337" fill="none" stroke="#8ca4ce" stroke-opacity=".26" stroke-width="5" stroke-dasharray="4 13" stroke-linecap="round"/><circle cx="580" cy="210" r="19" fill="#70dfff" fill-opacity=".82"/><circle cx="665" cy="175" r="17" fill="#8bc7ff" fill-opacity=".82"/><circle cx="750" cy="209" r="19" fill="#a7a8ff" fill-opacity=".82"/><circle cx="835" cy="170" r="17" fill="#d0a4ff" fill-opacity=".82"/><circle cx="920" cy="209" r="22" fill="#f2a5ea" fill-opacity=".82"/><circle cx="1067" cy="225" r="37" fill="#80e9ff" fill-opacity=".25"/><path d="M1067 188 L1075 217 L1104 225 L1075 233 L1067 262 L1059 233 L1030 225 L1059 217 Z" fill="#baf7ff"/>

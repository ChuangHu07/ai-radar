<path d="M0 390 C260 325 470 453 705 370 S1010 330 1200 255" fill="none" stroke="#637fc1" stroke-opacity=".1" stroke-width="2"/>
<g fill="#a5b4fc" opacity=".48"><circle cx="58" cy="62" r="2"/><circle cx="1124" cy="73" r="2"/><circle cx="1088" cy="375" r="2"/><circle cx="177" cy="382" r="2"/></g>

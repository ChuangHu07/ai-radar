<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">一张流程图适配多种画布</title><desc id="desc">左侧原图经重排后适配横向和纵向画布，连接关系保持。</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#09132d"/><stop offset=".55" stop-color="#14204b"/><stop offset="1" stop-color="#251752"/></linearGradient>
<linearGradient id="glass" x2="1" y2="1"><stop stop-color="#c3dafe" stop-opacity=".22"/><stop offset="1" stop-color="#a58cff" stop-opacity=".07"/></linearGradient>
<linearGradient id="beam" x2="1"><stop stop-color="#44d8ff"/><stop offset=".55" stop-color="#8b8bff"/><stop offset="1" stop-color="#f4a6ff"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#6e82ff" stop-opacity=".35"/><stop offset="1" stop-color="#6e82ff" stop-opacity="0"/></radialGradient>
<filter id="soft"><feGaussianBlur stdDeviation="22"/></filter>
<filter id="lift"><feDropShadow dx="0" dy="14" stdDeviation="17" flood-color="#010819" flood-opacity=".4"/></filter>
